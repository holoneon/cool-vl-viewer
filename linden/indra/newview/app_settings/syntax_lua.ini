llkeywords version 3
; Version 3 is an extension of LL's version 2 format for the Cool VL Viewer:
; the colors of the highlights are no more given as LLColor3 equivalent
; tripplets, such as [word .1, .3, .1]  (although the latter would still be
; understood and usable), but as the name of a color entry in colors_base.xml,
; such as [word LslSectionsTextFgColor]. This allows to change the highlighting
; colors on a per-skin basis.
; Also, the comment character for this file has been changed from '#' to ';' so
; to allow highligthing preprocessor #directives.
; Finally, ':' has been replaced with '|' to trigger a line feed in the tool
; tip, so that ':' can be used for the SLua parameters in the keywords syntax.

; String literals
[two_sided_delimiter LslStringsTextFgColor]
'					String literal
`					String literal

; Flow control label. Note: does not seem to work in the SLua compiler, as of 2025-03-12.
[two_sided_delimiter LslFlowControlTextFgColor]
::				Label for 'goto' statement, ending with ::

; Comment
[one_sided_delimiter LslFlowCommentsTextFgColor]
--				Comment:Non-functional commentary or disabled code

; Comment
[two_sided_delimiter LslFlowCommentsTextFgColor]
--[[			Multi-line comment:Non-functional commentary or disabled code, ending with ]]

; Flow control keywords
[word LslFlowControlTextFgColor]
function 		Lua function keyword: begins a function definition.
end				Lua keyword to close control structures like 'if', 'do', 'while', 'for' and 'function'.
return			Lua statement to return a value from a function, or to abort a function not returning any value.
goto			Lua statement to jump to a specified label.
if				Lua conditional block statement: if condition then ... end
then			Lua statement introducing the block executed when an 'if' condition evaluates to 'true'.
else			Lua statement introducing the alternative block when the 'if' statement condition evaluates to 'false'.
elseif			Lua statement providing an additional conditional branch in an 'if' statement.
for				Lua loop statement. Example: for var = start, end, step do ... end
do				Lua statement for a 'do' block: do ... end
while			Lua loop statement. Example: while condition do ... end
repeat			Lua loop statement. Example: repeat ... until condition.
until			Lua statement ending a repeat loop by testing a condition.
break			Lua statement exiting the innermost enclosing loop.
llcompat		SLua compatibility library. For example, you may declare 'll = llcompat' before using the LSL-compatible versions of the ll.Functions.

; Data types
[word LslDataTypesTextFgColor]
boolean			Lua boolean: represents a true or false value.
number			Lua number type
quaternion		Lua quaternion type
uuid			Lua UUID type

; Constants
[word LslIntegerConstTextFgColor]
nil					Lua special value representing the absence of a useful value.
true				Lua boolean true value.
false				Lua boolean false value.
math.pi				Lua math library function returning the PI value.
lljson.null			SLua constant to represent JSON null explicitly.
rotation.identity	SLua constant corresponding to the identity rotation (same as ZERO_ROTATION).

; Other
[word LslSectionsTextFgColor]
local			Lua local keyword: declares a local variable or function.
..				Lua string concatenation operator.
type			Lua function returning the type of its only argument, coded as a string. Returns "userdata" for all the types added by SLua (use typeof() for those).
typeof			SLua function returning the type of its only argument, coded as a string. Properly recognizes SLua new types (vector, quaternion, uuid).
tostring		Lua function to convert non-string values to a string.
tonumber		Lua function to convert non-number values to a number.
tovector		SLua function to convert a string to a SLua vector.
torotation		SLua function to convert a string to a SLua rotation/quaternion.
toquaternion	SLua function to convert a string to a SLua rotation/quaternion.
touuid			SLua function to convert a string to a SLua UUID.
ipairs			Lua function, to use in 'for' loops to iterate over indexed arrays. ipairs(a) returns three values (the next function, the array a and 0). Example: for i,v in ipairs(t) do ... end
pairs			Lua function, to use in 'for' loops to iterate over key/value tables. pairs(t) returns three values (the next function, the table t and nil). Example: for k,v in pairs(t) do ... end
and				Lua and operator: performs logical conjunction.
or				Lua or operator: performs logical disjunction.
not				Lua not operator: performs logical negation.
in				Lua in keyword: used in generic 'for' loops to iterate over elements.
next			Lua function to get the next element in a table (passed as the first argument) after the element at the index passed as the optional second argument (returns the first element of the table when the second argument is omitted or 'nil'). Example: second_element=next(table,1)
select			Lua funtion returning all its arguments after the index it gets passed as the first argument (a negative index counts from the end of the arguments list). Example: v_arg2,v_arg3=select(2,arg1,arg2,arg3)
assert			Lua funtion to raise an error when the first passed argument evaluates to 'false', with an optional custom error message passed as the second argument. Example: assert(0==1,"0 and 1 differ")
error			Lua funtion to raise an error with the passed message as the error object. This function never returns. Example: error("This is an error")
getmetatable	Lua function returning the metatable of the passed object, or 'nil' if the object does not have a metatable.
pcall			Lua function to call another function (which names and own arguments are passed as arguments to pcall) in protected mode, meaning any error in the called function would be returned by pcall instead of stopping the script with an error. Example: err=pcall(func,arg1,arg2)
print			Lua print function: does not actually print anything in SLua (this seems to be a no-operation).
rawlen			Lua function to get the length of a table or a string, without invoking the __len metamethod. Returns an integer. Example: len=rawlen(table)
rawequal		Lua function checking whether its first argument is equal to its second argument, without invoking the __eq metamethod. Returns a boolean. Example: is_equal=rawequal(v1,v2)
rawget			Lua function to get the real value of a table element, without using the _index metavalue. Example: first_value=rawget(table,1)
rawset			Lua function to set the real value of a table element, without using the __newindex metavalue. Returns the (modified) table. Example: copied_table=rawset(table, index, value)
setmetatable	Lua function to set the metatable for the given table. If metatable is nil, removes the metatable of the given table. If the original metatable has a __metatable field, raises an error. Returns the (modified) table. Example: copied_table=setmetatable(table,metatable)
; Math library
math.abs		Lua function returning the absolute value of the passed number.
math.ceil		Lua function returning the smallest integral value greater than or equal to the passed number.
math.floor		Lua function returning the largest integral value less than or equal to the passed number.
math.max		Lua function returning the largest value among all the passed arguments.
math.min		Lua function returning the smallest value among all the passed arguments.
math.fmod		Lua function returning the remainder of the division of the first passed argument by the second, that rounds the quotient towards zero.
math.modf		Lua function returning two numbers representing the integral and the fractional parts (as a float) of the passed number.
math.exp		Lua function returning the natural exponentiation of the passed agument.
math.log		Lua function returning the natural logarithm of the passed agument, or when a second base argument is passed, the logarithm for that base.
math.sqrt		Lua function returning the square root of the passed agument.
math.acos		Lua function returning the arc cosine of the passed number, in radians.
math.asin		Lua function returning the arc sine of the passed number, in radians.
math.atan		Lua function returning the arc tangent of the passed number, in radians. Also accepts two parameters (e.g. math.atan(y,x)) to find the quadrant of the result.
math.cos		Lua function returning the cosine of the passed number (which must be in radians).
math.sin		Lua function returning the sine of the passed number (which must be in radians).
math.tan		Lua function returning the tangent of the passed number (which must be in radians).
math.deg		Lua function returning the passed angle (in radians) in degrees.
math.rad		Lua function returning the passed angle (in degrees) in radians.
math.random		Lua function returning a pseudo-random float with uniform distribution in the range from 0.0 to 1.0. When called with two integers as math.random(m,n), returns a pseudo-random integer in the range from m to n.
math.isfinite	SLua function returning true if the number is finite (not inf, -inf or NaN).
math.isinf		SLua function returning true if the number is infinite (inf or -inf).
math.isnan		SLua function returning true if the number is a Nan.
os.date			Lua function returning a string (or a table when format is "*t") containing date and time, formatted according to the given string format (if omitted "%c" is used). Unless a second, time argument is passed (in number of seconds since UNIX epoch), the current time is used. Example: epoch=os.date("%c",0);now=os.date()
os.time			Lua function returning the current time when called without arguments, or a time representing the local date and time specified by the given table. This table must have fields year, month, and day, and may have fields hour (default is 12), min (default is 0), sec (default is 0), and isdst (default is nil).
os.difftime		Lua function returning the difference between two time values passed as arguments (in number of seconds since UNIX epoch).
; String library
string.len		Returns the length of the string passed as a parameter.
string.lower	Returns the lowercase version of the string passed as a parameter.
string.upper	Returns the uppercase version of the string passed as a parameter.
string.find		string.find(s, pattern[, init[, plain]])|Searches for 'pattern' in the string 's' and returns the start and end positions. If 'plain' is true, the pattern is treated as a plain string (no pattern matching). Supports negative indices.
string.sub		string.sub(s, i[, j])|Returns the substring of 's' from position 'i to 'j' (inclusive), or to the end of the string when 'j' is omitted.
string.split	string.split(s, sep)| Splits string 's' into parts using 'sep' as the delimiter. Returns an array table.
string.rep		string.rep(s, n)|Repeats 'n' times the string 's' and returns the resulting string.
string.reverse	Returns the reversed version of the string passed as a parameter.
string.gsub		string.gsub(s, pattern, rep[, n])| Returns a new string where occurrences of 'pattern' in 's' are replaced by 'rep', as well as returns the number of substitutions. Also accepts a function as the replacement parameter.
string.format	string.format(fmt, ...)|Formats a string following the format given in 'fmt' and using each passsed parameter value to replace the corresponding positional placeholders in 'fmt'. See the Lua manual for details.
string.match	string.match(s, pattern[, init])|Searches the first match of 'pattern', starting search at position 'init' (or 1 when omitted) in string 's'. Returns the matched part.
string.gmatch	string.gmatch(s, pattern)|Returns an iterator over all matches of 'pattern' in string 's'.
; Vector library
vector.create		Creates a new vector using the three passed parameters to initialize the x, y and z coordinates.
vector.magnitude	Returns the magnitude of the vector passed as a parameter.
vector.normalize	Returns the normalized version of the vector passed as a parameter.
vector.dot			Returns the dot product of the vectors passed as a parameters.
vector.cross		Returns the cross product of the vectors passed as a parameters.
vector.angle		vector.angle(vec1, vec2[, axis])|Returns the angle between the vectors in radians. The axis, if specified, is used to determine the sign of the angle.
vector.lerp			vector.lerp(v1, v2, interp)|Performs linear interpolation between two vectors. It calculates a specific point along the straight, shortest line between vector 'v1' and vector 'v2', based on percentage 'interp' (between 0.0 and 1.0).
; Rotation library
rotation.create		Creates a new vector using the four passed parameters to initialize the x, y, z and t coordinates.
rotation.magnitude	Returns the magnitude of the rotation passed as a parameter.
rotation.normalize	Returns the normalized version of the rotation passed as a parameter.
rotation.dot		Returns the dot product of the rotations passed as a parameters.
rotation.conjugate	Returns the opposite of the rotation passed as a parameter. E.g if 'rot' rotates 90° left then rotation.conjugate(rot) rotates 90° right.
rotation.slerp		rotation.slerp(rot1, rot2, interp)|Returns a smooth rotation between start rotation 'rot1' and target rotation 'rot2', based on percentage 'interp' (between 0.0 and 1.0).
rotation.tofwd		Returns the forward vector (local X-axis) of the rotation.
rotation.toleft		Returns the left vector (local Y-axis) of the rotation.
rotation.toup		Returns the up vector (local Z-axis) of the rotation.
; Table library
table.insert	table.insert(lua_table, element)|Inserts 'element' into 'lua_table'.
table.remove	table.remove(lua_table, element)|Removes 'element' from 'lua_table'.
table.move		table.move(lua_table1, table1_start_idx, elements_count, table2_start_idx, lua_table2)|Copies or moves a range of elements from one part of an array table to another part or into a different array table. It returns the modified table.
table.create	table.create(count, value)|Creates an array table of 'count' elements of a default 'value'.
table.concat	table.concat(lua_table, separator)|Returns a string containing the list of the elements in 'lua_table' separated from each other by the 'separator' string.
table.append	table.append(lua_table, ...)|Appends to 'lua_table' as many elements as passed as additionnal parameters.
table.extend	table.extend(t1, t2)|Inserts the values of table 't2' into table 't1', starting at index #t1+1. It is the same as table.move(t2, 1, #t2, #t1+1, t1)
; bit32 library
bit32.band		Returns the result of the bitwise 'and' operation on the two (or more) passed numbers.
bit32.bor		Returns the result of the bitwise 'or' operation on the two (or more) passed numbers.
bit32.bxor		Returns the result of the bitwise 'xor' operation on the two (or more) passed numbers.
bit32.bnot		Returns the result of the bitwise 'not' operation on the passed number.
bit32.lshift	bit32.lshift(x, n)|Returns the result of the left-shift of 'x' by 'n' bits.
bit32.arshift	bit32.lshift(x, n)|Returns the result of the arithmetic right-shift of 'x' by 'n' bits.
bit32.btest		Returns true when the result of the bitwise and of the two passed numbers is not 0, or false if it is 0.
bit32.s32		Converts the passed number and returns the corresponding 32 bits signed integer. This truncates decimals forces the number to wrap around if it exceeds the signed 32 bits limits.
bit32.smul		Returns the 32 bits integer corresponding to the multiplication of the two passed numbers like if they were 32 bits signed integers, mimicking the overflow that would happen in 32 bits arithmetic should the result be too large to fit 32 bits.
; lljson and llbase64 libraries
lljson.encode	SLua method to encode a Lua table into a JSON string.
lljson.decode	SLua method to decode a JSON string into a Lua table.
lljson.slencode	SLua method to encode a Lua table into a JSON string, preserving types.
lljson.sldecode	SLua method to decode a JSON string into a Lua table, preserving types.
llbase64.encode	SLua method to encode the passed arbitrary string into a base64 string.
llbase64.decode	SLua method to convert the passed base64-encoded string into the corresponding decoded string.
; LLTimers library
LLTimers:every	SLua method to create a repeating timer.
LLTimers:once	SLua method to create a one-shot timer.
LLTimers:off	SLua method to stop a timer.
; LLEvents library
LLEvents:on		SLua method to register a repeating event handler.
LLEvents:once	SLua method to register a one-shot event handler.
LLEvents:off	SLua method to deactivate an event handler.

; Events function names
[word LslEventsTextFgColor]
LLEvents.touch_start					LLEvents.touch_start(NumberOfTouches: number)|Triggered by the start of agent clicking on task
LLEvents.touch							LLEvents.touch(NumberOfTouches: number)|Triggered while agent is clicking on task
LLEvents.touch_end						LLEvents.touch_end(NumberOfTouches: number)|Triggered when agent stops clicking on task
LLEvents.collision_start				LLEvents.collision_start(NumberOfCollisions: number)|Triggered when task starts colliding with another task
LLEvents.collision						LLEvents.collision(NumberOfCollisions: number)|Triggered while task is colliding with another task
LLEvents.collision_end					LLEvents.collision_end(NumberOfCollisions: number)|Triggered when task stops colliding with another task
LLEvents.land_collision_start			LLEvents.land_collision_start(Position: vector)|Triggered when task starts colliding with land
LLEvents.land_collision					LLEvents.land_collision(Position: vector)|Triggered when task is colliding with land
LLEvents.land_collision_end				LLEvents.land_collision_end(Position: vector)|Triggered when task stops colliding with land
LLEvents.timer							LLEvents.timer():Result of the ll.SetTimerEvent library function call.
LLEvents.handlers						LLEvents.handlers(Channel: number, Name: string, Id: string, Text: string)|Result of the llListen library function call
LLEvents.sensor							LLEvents.sensor(NumberDetected: number)|Result of the ll.Sensor library function call
LLEvents.no_sensor						LLEvents.no_sensor()|Result of the llSensor library function call
LLEvents.control						LLEvents.control(AvatarID: string, Levels: number, Edges: number)|Result of llTakeControls library function call
LLEvents.at_target						LLEvents.at_target(TargetNumber: number, TargetPosition: vector, CurrentPosition: vector)|Result of llTarget library function call
LLEvents.not_at_target					LLEvents.not_at_target()|Result of llTarget library function call
LLEvents.at_rot_target					LLEvents.at_rot_target(TargetNumber: number, TargetRotation: quaternion, CurrentRotation: quaternion)|Result of llRotTarget library function call
LLEvents.not_at_rot_target				LLEvents.not_at_rot_target()|Result of llRotTarget library function call
LLEvents.money							LLEvents.money(Payer_id: string, Amount: number)|Triggered from an llTransferLindenDollars() call.|'Payer_id' matches the return value of the llTransferLindenDollars() call and if the transaction was a success will match the 'transaction id' shown in transaction history on secondlife.com.|'Success' is TRUE if the transfer succeeded otherwise FALSE.|On successful transaction 'Data' will contain a CSV of destination ID and amount transferred. In failure cases it will contain an error tag on failure.
LLEvents.transaction_result				LLEvents.transaction_result(RequestId: string, Success: number, Message: string)|Triggered when L$ is given to task
LLEvents.email							LLEvents.email(Time: string, Address: string, Subject: string, Body: string, NumberRemaining: number)|Triggered when task receives email
LLEvents.run_time_permissions			LLEvents.run_time_permissions(PermissionFlags: number)|Triggered when an agent grants run time permissions to task
LLEvents.attach							LLEvents.attach(AvatarID: string)|Triggered when task attaches or detaches from agent
LLEvents.dataserver						LLEvents.dataserver(RequestId: string, Data: string)|Triggered when task receives asynchronous data
LLEvents.moving_start					LLEvents.moving_start()|Triggered when task begins moving
LLEvents.moving_end						LLEvents.moving_end()|Triggered when task stops moving
LLEvents.on_rez							LLEvents.on_rez(StartParameter: number)|Triggered when task is rezed in from inventory or another task
LLEvents.object_rez						LLEvents.object_rez(RezzedObjectsId: string)|Triggered when task rezes in another task
LLEvents.link_message					LLEvents.link_message(SendersLink: number, Value: number, Text: string, Id: string)|Triggered when task receives a link message via llMessageLinked library function call
LLEvents.changed						LLEvents.changed(Changed: number)|Triggered various event change the task|(test 'Changed' with CHANGED_INVENTORY, CHANGED_COLOR, CHANGED_SHAPE, CHANGED_SCALE, CHANGED_TEXTURE, CHANGED_LINK, CHANGED_ALLOWED_DROP, CHANGED_OWNER, CHANGED_REGION, CHANGED_TELEPORT, CHANGED_REGION_START, CHANGED_MEDIA, CHANGED_RENDER_MATERIAL)
LLEvents.remote_data					LLEvents.remote_data(EventType: number, ChannelID: string, MessageID: string, Sender: string, IData: number, SData: string)|Triggered by various XML-RPC calls (EventType will be one of REMOTE_DATA_CHANNEL, REMOTE_DATA_REQUEST, REMOTE_DATA_REPLY)
LLEvents.http_response					LLEvents.http_response(HTTPRequestId: string, Status: number, Metadata: {any}, Body: string)|Triggered when task receives a response to one of its llHTTPRequests
LLEvents.http_request					LLEvents.http_request(HTTPRequestId: string, HTTPMethod: string, Body: string)|Triggered when task receives an http request against a public URL
LLEvents.path_update					LLEvents.path_update(Type: number, Reserved: {any})|Triggered when task receives a path finding event. The event 'Type' is passed as an integer (see the PU_* constants). The list parameter is 'Reserved' for future use.
LLEvents.experience_permissions			LLEvents.experience_permissions(AvatarID: string)|Triggered when the agent (whose key is AvatarID) has approved an experience permissions request.
LLEvents.experience_permissions_denied	LLEvents.experience_permissions_denied(AvatarID: string, Reason: number)|Triggered when the agent (whose key is AvatarID) has denied an experience permission. 'reason' contains the error code (see the XP_ERROR_* constants).
LLEvents.linkset_data					LLEvents.linkset_data(Action: number, Name: string, Value: string)|Triggered whenever the linkset data storage is changed.
LLEvents.on_damage						LLEvents.on_damage(Count: number)|Triggered when damage has been inflicted on an avatar or task in the world but before damage has been applied or distributed.
LLEvents.on_death						LLEvents.on_death()|Triggered on all attachments worn by an avatar when that avatar's health reaches 0.
LLEvents.final_damage					LLEvents.final_damage(Count: number)|Triggered after all on_damage events in all scripts and attachments have processed and damage has been applied to the avatar or distributed to all seated avatars.
LLEvents.game_control					LLEvents.game_control(Id: string, Buttons: number, Axes: {any})|Triggered when compatible viewer (not yet implemented in the Cool VL Viewer), sends fresh GameControlInput message, but only for scripts on attachments or seat.
