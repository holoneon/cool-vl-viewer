<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
	<description>Default configuration file override</description>
	<include ignore_missing="no">/etc/fonts/fonts.conf</include>
	<rejectfont>
		<glob>*.otb</glob>
	</rejectfont>
	<rejectfont>
		<glob>*.OTB</glob>
	</rejectfont>
    <rejectfont>
      <pattern>
        <patelt name="outline"><bool>false</bool></patelt>
        <patelt name="scalable"><bool>false</bool></patelt>
      </pattern>
    </rejectfont>
</fontconfig>
